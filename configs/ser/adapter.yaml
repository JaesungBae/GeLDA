# ########################################
# SER task adapter on frozen SFM features (Stages 1 and 3), trained with SpeechBrain.
#
# This is the EmoBox recipe (https://github.com/emo-box/EmoBox), which is based on
# https://github.com/speechbrain/speechbrain/blob/develop/recipes/IEMOCAP/emotion_recognition/hparams/train_with_wav2vec2.yaml
# The values marked !PLACEHOLDER are set by scripts/train_ser.py and scripts/finetune_ser.py.
# ########################################

# Seed needs to be set at top of yaml, before objects with parameters are made
seed: 1234
__set_seed: !apply:torch.manual_seed [!ref <seed>]

output_folder: !PLACEHOLDER
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

# Latent space Z^(layer) of the training inputs: 0 for Stage 1, 0/1/2 for Stage 3
layer: 0

# The train logger writes training statistics to a file, as well as stdout.
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

# Training parameters
# Stage 1 trains epochs 1-100. Stage 3 continues from the Stage-1 adapter with
# number_of_epochs: 200, i.e. epochs 101-200 with a fresh optimizer and scheduler.
number_of_epochs: 100
batch_size: 32
lr: 0.001
num_warmup_steps: 10
ckpt_interval_epochs: 10

# Model parameters
encoder_dim: !PLACEHOLDER  # dimension of z^(0): 1280 / 1024 / 768
hidden_size_1: 512
hidden_size_2: 256

# Number of emotions
out_n_neurons: 7

dataloader_options:
    batch_size: !ref <batch_size>
    shuffle: True
    num_workers: 0
    drop_last: False

output_mlp: !new:gelda.adapter.TaskAdapter
    in_dim: !ref <encoder_dim>
    hidden: [!ref <hidden_size_1>, !ref <hidden_size_2>]
    num_classes: !ref <out_n_neurons>

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

modules:
    output_mlp: !ref <output_mlp>

model: !new:torch.nn.ModuleList
    - [!ref <output_mlp>]

log_softmax: !new:speechbrain.nnet.activations.Softmax
    apply_log: True

compute_cost: !name:speechbrain.nnet.losses.nll_loss

opt_class: !name:torch.optim.Adam
    lr: !ref <lr>

lr_annealing: !new:speechbrain.nnet.schedulers.LinearWarmupScheduler
    initial_value: !ref <lr>
    num_warmup_steps: !ref <num_warmup_steps>
    num_training_steps: !ref <number_of_epochs>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        model: !ref <model>
        lr_annealing_output: !ref <lr_annealing>
        counter: !ref <epoch_counter>
